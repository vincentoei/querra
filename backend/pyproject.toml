[project]
name = "querra-text-to-sql"
version = "0.1.0"
description = "Text-to-SQL assistant with QLoRA fine-tuning on Spider"
authors = [{ name = "Vincent Oei" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "torch>=2.11.0",
    "bitsandbytes>=0.45.0",
    "huggingface_hub>=0.28.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "peft>=0.14.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "sqlglot>=26.0.0",
    "sqlparse>=0.5.0",
    "transformers>=4.49.0",
]

[project.optional-dependencies]
train = [
    "datasets>=3.0.0",
    "tqdm>=4.66.0",
    "trl>=0.15.0",
    "wandb>=0.19.0",
]
serve = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
