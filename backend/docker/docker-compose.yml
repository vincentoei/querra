services:
  api-gpu:
    build:
      context: ../
      dockerfile: docker/Dockerfile.gpu
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../data:/app/data
      - ../.env:/app/.env:ro
      - huggingface-cache:/app/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - ADAPTER_PATH=/app/models/best-model
    profiles:
      - gpu

  api-cpu:
    build:
      context: ../
      dockerfile: docker/Dockerfile.cpu
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../data:/app/data
      - ../.env:/app/.env:ro
      - huggingface-cache:/app/cache/huggingface
    environment:
      - ADAPTER_PATH=/app/models/best-model
      - USE_CPU=1
    profiles:
      - cpu

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: querra_test
      POSTGRES_USER: querra
      POSTGRES_PASSWORD: querra
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querra -d querra_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - test-db

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: querra_test
      MYSQL_USER: querra
      MYSQL_PASSWORD: querra
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - test-db

volumes:
  huggingface-cache:
  postgres-data:
  mysql-data:
